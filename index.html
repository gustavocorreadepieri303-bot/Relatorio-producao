<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Produção</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="body">

    <div id="meu-modal-refugo" class="modal-refugo" style="display:none;">
        <form id="form-refugo" onsubmit="enviarRefugo(event)">
            <div class="modal-conteudo">
                <h2>Refugos</h2>
                <label for="input-refugo">KG de Refugo Garrafa:</label>
                <input type="text" id="input-refugo-grf" name="quantidade_refugo_grf" min="0" required>
                <label for="input-refugo">KG de Refugo Preforma:</label>
                <input type="text" id="input-refugo-prf" name="quantidade_refugo_prf" min="0" required>
                <label for="select-Linha-rfg">Linha:</label>
                <select id="select-Linha-rfg" name="linha" required="">
                    <option value="">-- Selecione a Linha --</option>
                    <option value="Linha 1">Linha 1</option>
                    <option value="Linha 2">Linha 2</option>
                    <option value="Linha 3">Linha 3</option>
                    <option value="Linha 4">Linha 4</option>
                    <option value="Linha 5">Linha 5</option>
                    <option value="Linha 6">Linha 6</option>
                    <option value="Linha 7">Linha 7</option>
                    <option value="Linha 8">Linha 8</option>
                    <option value="Linha 9">Linha 9</option>
                    <option value="Linha 10">Linha 10</option>
                    <option value="Linha 11">Linha 11</option>
                    <option value="Linha 12">Linha 12</option>
                    <option value="Linha 14">Linha 14</option>
                </select>
                <label for="input-turno-refugo">Turno:</label>
                <select id="input-turno-refugo" name="turno_refugo" required>
                    <option value="">-- Selecione o Turno --</option>
                    <option value="A">Turno A</option>
                    <option value="B">Turno B</option>
                    <option value="C">Turno C</option>
                    <option value="D">Turno D</option>
                </select>
                <div class="b-space">
                    <button type="button" class="modal-btn" onclick="fecharModalRefugo()">Cancelar</button>
                    <button type="submit" class="modal-btn">Enviar</button>
                </div>
            </div>
        </form>
    </div>

    <div id="Rascunho">
        <div class="rascunho-conteudo">
            Total de Paletes: <span id="num-tracos">0</span>
            <div id="container-marcas"></div>
            <div class="campo-btn">
                <button id="btn-adicionar" class="btn">Adicionar Traço</button>
                <button id="btn-resetar" class="btn">Desfazer</button>
            </div>
            <button type="button" class="modal-btn"
                onclick="document.getElementById('Rascunho').style.display='none'">Fechar</button>
        </div>
    </div>

    <!-- Cabeçalho com o botão de Tutorial -->
    <div class="head">
        <h1>Relatório De Produção</h1>
        <button type="button" class="btn-tutorial" onclick="abrirModalTutorial()">📖 Tutorial</button>
    </div>

    <!-- =================================================================== -->
    <!-- MODAL DE TUTORIAL COM VÍDEOS LOCAIS -->
    <!-- =================================================================== -->
    <div id="modal-tutorial" class="modal-tutorial" style="display: none;">
        <div class="modal-tutorial-conteudo">
            <span class="fechar-tutorial" onclick="fecharModalTutorial()">&times;</span>
            <h2>Central de Tutoriais</h2>

            <div class="tutorial-container">
                <!-- Menu Lateral / Lista de Opções -->
                <div class="tutorial-lista">
                    <button class="tutorial-item active"
                        onclick="carregarVideoLocal('videos/Preencher-cabeçalho.mp4', 'Como preencher o Relatório de Produção', this)">
                        1. Preencher Cabeçalho
                    </button>
                    <button class="tutorial-item"
                        onclick="carregarVideoLocal('videos/Fazer-apontamento.mp4', 'Como registrar produção de Máquina', this)">
                        2. Registrar Produção e parada de almoço/janta
                    </button>
                    <button class="tutorial-item"
                        onclick="carregarVideoLocal('videos/Registrar-parada.mp4', 'Lançamento de Paradas', this)">
                        3. Registrar Parada
                    </button>
                    <button class="tutorial-item"
                        onclick="carregarVideoLocal('videos/Registrar-refugo.mp4', 'Lançamento de Refugos de Garrafa e Preforma', this)">
                        4. Lançar Refugos
                    </button>
                </div>

                <!-- Player de Vídeo HTML5 -->
                <div class="tutorial-player">
                    <h3 id="tutorial-titulo-video">Como preencher o Relatório de Produção</h3>
                    <div class="video-wrapper">
                        <video id="player-tutorial" controls preload="metadata">
                            <source id="source-tutorial" src="videos/Preencher-cabeçalho.mp4    " type="video/mp4">
                            O seu navegador não suporta a exibição de vídeos.
                        </video>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <form id="form-produção" onsubmit="enviarParaPlanilha(event)" oninput="salvarRascunhoCampos()">

        <div class="input-garrafa">
            <div class="campo-grupo">
                <label for="select-Linha">Linha:</label>
                <select id="select-Linha" name="linha" required="">
                    <option value="">-- Selecione a Linha --</option>
                    <option value="Linha 1">Linha 1</option>
                    <option value="Linha 2">Linha 2</option>
                    <option value="Linha 3">Linha 3</option>
                    <option value="Linha 4">Linha 4</option>
                    <option value="Linha 5">Linha 5</option>
                    <option value="Linha 6">Linha 6</option>
                    <option value="Linha 7">Linha 7</option>
                    <option value="Linha 8">Linha 8</option>
                    <option value="Linha 9">Linha 9</option>
                    <option value="Linha 10">Linha 10</option>
                    <option value="Linha 11">Linha 11</option>
                    <option value="Linha 12">Linha 12</option>
                    <option value="Linha 14">Linha 14</option>
                </select>
                <label for="select-turno">Turno:</label>
                <select id="select-turno" name="turno_trabalho" required="">
                    <option value="">-- Selecione o Turno --</option>
                    <option value="A">Turno A</option>
                    <option value="B">Turno B</option>
                    <option value="C">Turno C</option>
                    <option value="D">Turno D</option>
                </select>
            </div>
            <input type="text" id="input-garrafa" name="input-garrafa" placeholder="Nome da garrafa" required="">
            <input type="text" id="input-preforma" name="quantidade_preforma" placeholder="Número da Preforma"
                required="">
            <input type="text" id="input-lote-preforma" name="input-lote-preforma" placeholder="Lote da preforma"
                required="">
            <div class="data">
                <label for="input-data">Data:</label>
                <input type="date" id="input-data" name="data" required="">
            </div>

            <div class="realizado">
                <label for="realizado_por">Realizado Por:</label>
                <input type="text" id="input-name" name="realizado_por" placeholder="Equipe. Ex: A1" required="">
            </div>
        </div>

        <div class="info-space">
            <div id="grupo-motivo-parada" class="linha-info" style="display:none;">
                <input type="text" id="input-motivo-parada" name="motivo_parada_texto" readonly>
                <input type="hidden" id="input-motivo-codigo" name="defeito_selected" value="">
                <span id="btn-limpar-motivo" title="Remover parada" style="cursor:pointer;">✕</span>
            </div>
            <div class="linha-info">
                <div class="linha-horario">
                    <label for="input-das">Hor. Ínicio:</label>
                    <input type="time" id="input-das" name="hora_das" readonly required="">
                </div>
                <div id="grupo-quantidades" class="linha-info">
                    <input type="text" id="input-qntd-p-fardo" name="qntd-p-fardo" placeholder="Qntd. grfs p/ Fardo"
                        required="">
                    <input type="text" id="input-qntd-fardo" name="qntd-fardo" placeholder="Qntd. fardos prod."
                        required="">
                </div>
                <div class="parada" onclick="validarEIrParaParada()" style="cursor: pointer;">
                    <h2>Parada</h2>
                </div>
                <div class="linha-horario">
                    <label for="input-ate">Hor. Final:</label>
                    <input type="time" id="input-ate" name="hora_ate" required="">
                </div>
                <div class="b-rascunho" onclick="abrirRascunho()" style="cursor: pointer;">
                    <img src="Img/Pencil.png" alt="Rascunho" style="width: 100%; height: 100%;">
                </div>
            </div>
        </div>

        <div class="b-space">
            <button type="button" class="back" onclick="abrirModalRefugo()">
                <h1>Refugos</h1>
            </button>
            <button type="submit" class="send">Enviar</button>
        </div>
    </form>

</body>

</html>
